name: Preserve Kingpin metadata and images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair canonical metadata without removing existing content or images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          # Correct the confirmed Spotify artist ID typo: digit 0 -> capital O.
          s = s.replace("7fSMDP0eWrFwYol9Vye2Ty", "7fSMDPOeWrFwYol9Vye2Ty")
          # Preserve the current images by using exact Cloudinary copies as stable delivery sources.
          s = s.replace(
              "https://res.cloudinary.com/dgeipeicd/image/upload/v1788912320/diggerman/social-preview-reference.jpg",
              "https://res.cloudinary.com/dgeipeicd/image/upload/v1788914905/diggerman/site-backups/2026-09-09/social-preview-reference-preserved.jpg"
          )
          s = s.replace(
              "https://kingpinpkaytee-dot.github.io/diggerman-site/assets/diggerman-preferred-photo.jpg",
              "https://res.cloudinary.com/dgeipeicd/image/upload/v1788914912/diggerman/site-backups/2026-09-09/diggerman-preferred-photo-preserved.jpg"
          )
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit repaired HTML only when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair Spotify ID and preserve images on Cloudinary"
          git push
