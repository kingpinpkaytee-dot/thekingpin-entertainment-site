name: Add DiggerMan Social Preview Reference
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add reference image without removing existing images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          url = "https://res.cloudinary.com/dgeipeicd/image/upload/v1788912320/diggerman/social-preview-reference.jpg"
          if url not in s:
              marker = '<meta property="og:image"'
              if marker in s:
                  s = s.replace(marker, f'<meta property="og:image" content="{url}" />\n    <meta property="og:image:alt" content="DiggerMan official reference image" />\n    <meta property="og:image:secure_url" content="{url}" />\n    {marker}', 1)
              else:
                  s = s.replace('</head>', f'<meta property="og:image" content="{url}" />\n    <meta property="og:image:alt" content="DiggerMan official reference image" />\n    <meta property="og:image:secure_url" content="{url}" />\n</head>', 1)
              if 'twitter:image" content="'+url+'"' not in s:
                  s = s.replace('</head>', f'<meta name="twitter:image" content="{url}" />\n</head>', 1)
              for typ in ("MusicGroup", "Person", "Organization"):
                  marker = f'"@type":"{typ}"'
                  pos = s.find(marker)
                  if pos < 0:
                      continue
                  end = s.find('}', pos)
                  if end < 0:
                      continue
                  obj = s[pos:end+1]
                  if '"image":' in obj:
                      if url not in obj:
                          obj = re.sub(r'"image":"([^"]+)"', lambda m: '"image":["'+url+'","'+m.group(1)+'"]', obj, count=1)
                  else:
                      obj = obj.replace('"name":', '"image":"'+url+'","name":', 1)
                  s = s[:pos] + obj + s[end+1:]
                  break
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add DiggerMan social preview reference image"
          git push
